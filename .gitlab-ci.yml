image: jdrouet/docker-with-buildx:stable

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - name: docker:dind
    command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

stages:
  - build
  - push

build:
  stage: build
  image: docker:latest
  script:
    - docker buildx build --platform linux/arm/v7,linux/arm64/v8,linux/amd64 --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} .

push:
  stage: push
  script:
    - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
    - docker buildx create --use
    - docker buildx build --push --platform linux/arm/v7,linux/arm64/v8,linux/386,linux/amd64 ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    - docker logout ${NEXUS_REPO_HOST}

