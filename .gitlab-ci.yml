# before_script:
#   - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

image: docker:dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - name: docker:dind
    command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

stages:
  - build
  - push

build:
  stage: build
  image: docker:latest
  script:
    - docker build --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} . --registry-mirror=https://${NEXUS_MIRROR_HOST}

push:
  stage: push
  script:
    - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
    - docker push ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    - docker logout ${NEXUS_REPO_HOST}

