# ---
include:
  - project: 'klausklausen/templates'
    ref: main
    file: 'tests.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'deploy.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'build.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'package.yml'

variables:
  TAG: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - package
  - deploy

# lint helm:
#   extends: .lint_helm_chart

yaml lint:
  extends: .lint_yaml

prettier:
  extends: .lint_prettier

unit_tests:
  stage: test
  image: python:3.9
  before_script:
    - pip install pytest
  script:
    - pytest tests/
  allow_failure: true

build test image:
  extends: .build_test
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: dev
build image:
  extends: .build_amd64_only
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: prod

# deploy helm:
#   extends: .package_deploy_helm_chart
