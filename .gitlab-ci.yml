variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - name: docker:dind
    command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

stages:
  - build
  - push

build:
  stage: build
  image: jdrouet/docker-with-buildx:stable
  script:
    - docker context create builder-context
    - docker buildx create --name builderx --driver docker-container --use builder-context
    - docker buildx build -f Dockerfile --push --platform ${PROJECT_PLATTFORMS} --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} .

push:
  stage: push
  image: jdrouet/docker-with-buildx:stable
  script:
    - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
    - docker buildx create --use
    - docker buildx build --push --platform ${PROJECT_PLATTFORMS} ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    - docker logout ${NEXUS_REPO_HOST}

