variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/etc/gitlab-runner/certs"

# services:
#   - name: docker:dind
#     command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

stages:
  - build
  - push

build:
  stage: build
  image: jdrouet/docker-with-buildx:stable
  script:
    - docker buildx create --name ci-builder --driver docker-container --platform ${PROJECT_PLATTFORMS}
    - docker buildx build --use ci-builder -f ${CI_PROJECT_DIR}/Dockerfile --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} .

push:
  stage: push
  image: jdrouet/docker-with-buildx:stable
  script:
    - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
    - docker push ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    - docker logout ${NEXUS_REPO_HOST}

