image: jdrouet/docker-with-buildx:latest

services:
  - name: jdrouet/docker-with-buildx:latest
    # command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/etc/gitlab-runner/certs"

# services:
#   - name: docker:dind
#     command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

before_script:
  - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
after_script:
  - docker logout ${NEXUS_REPO_HOST}

stages:
  - build
  # - push

build:
  stage: build
  image: jdrouet/docker-with-buildx:latest
  script:
    - echo "building ${CI_PROJECT_NAME} for ${PROJECT_PLATTFORMS}"
    - docker buildx create --driver docker-container --use
    - docker buildx build -f ${CI_PROJECT_DIR}/Dockerfile --platform ${PROJECT_PLATTFORMS} --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} . --no-cache --push

