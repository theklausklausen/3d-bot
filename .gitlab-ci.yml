image: docker:stable

services:
  - name: docker:stable
    command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/etc/gitlab-runner/certs"

# services:
#   - name: docker:dind
#     command: ["--registry-mirror", "https://${NEXUS_MIRROR_HOST}"]

before_script:
  - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
after_script:
  - docker logout ${NEXUS_REPO_HOST}

stages:
  - build
  # - push

build:
  stage: build
  image: docker:stable
  script:
    - docker context create ci-context
    - docker buildx create --driver docker-container --use ci-context
    - docker buildx use
    - docker buildx build --push -f ${CI_PROJECT_DIR}/Dockerfile --platform ${PROJECT_PLATTFORMS} --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} .

