---
include:
  - project: 'klausklausen/templates'
    ref: main
    file: 'test.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'deploy.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'build.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'package.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'security.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'lint.yml'

variables:
  TAG: $CI_COMMIT_BRANCH

stages:
  - test
  - security
  - build
  - package
  - deploy

# security
secret_scan:
  extends: .secret_scan
package_scan:
  extends: .package_scan

# lint
ansible lint:
  extends: .ansible_lint
markdown lint:
  extends: .markdown_lint
yaml lint:
  extends: .yaml_lint
prettier:
  extends: .prettier

# test
unit tests:
  stage: test
  image: python:3.9
  before_script:
    - pip install pytest
  script:
    - pytest tests/
  allow_failure: true
build test image:
  extends: .build_test
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: dev

# build
build image:
  extends: .image_multi_arch
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    BUILD_TARGET: prod

# package
package image:
  extends: .image_tag
  variables:
    IMAGE_NAME: ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME}
  tags:
    - amd64

# deploy helm:
#   extends: .package_deploy_helm_chart
