image: repo.kk.int/runner-dind:latest

variables:
  DOCKER_DRIVER: overlay2
  # DOCKER_TLS_CERTDIR: ""

before_script:
  - docker login -u${NEXUS_CI_USER} -p${NEXUS_CI_PASSWORD} ${NEXUS_REPO_HOST}
after_script:
  - docker logout ${NEXUS_REPO_HOST}

stages:
  - build
  - push

build:
  stage: build
  script:
    - echo "building ${CI_PROJECT_NAME} for ${PROJECT_PLATTFORMS}"
    - docker buildx create 
      --name ci-builder
      --driver docker-container
      --config /etc/buildkit.toml
      --use
    - docker buildx inspect --bootstrap
    - docker buildx build 
        --push
        -f ${CI_PROJECT_DIR}/Dockerfile 
        --platform ${PROJECT_PLATTFORMS} 
        --tag ${NEXUS_REPO_HOST}/${CI_PROJECT_NAME} . 

